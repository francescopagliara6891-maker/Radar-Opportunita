name: Radar Opportunita Bot

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

# Variabile globale per zittire l'avviso di Node.js 20
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installazione dipendenze
      run: pip install -r requirements.txt

    - name: Esecuzione Radar
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    - name: Salvataggio Memoria
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add history_radar.json || true
        git commit -m "Aggiornamento database radar" || echo "Nessun cambiamento da salvare"
        git push || echo "Nessun push necessario"
