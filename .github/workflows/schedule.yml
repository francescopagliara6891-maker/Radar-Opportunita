name: Radar Opportunita Bot

on:
  schedule:
    - cron: '0 */3 * * *' # Esegue ogni 3 ore
  workflow_dispatch: # Permette di avviarlo manualmente

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Fondamentale per salvare il file history_radar.json

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installazione dipendenze
      run: pip install -r requirements.txt

    - name: Esecuzione Radar
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    - name: Salvataggio Memoria
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add history_radar.json || true
        git commit -m "Aggiornamento database radar" || echo "Nessun cambiamento da salvare"
        git push || echo "Nessun push necessario"
